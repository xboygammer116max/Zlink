    .link-card{max-width:420px;width:100%;max-height:98vh;background:rgba(18,18,24,.9);border-radius:1.5rem;padding:.8rem .8rem .6rem;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;position:relative}
    .card-header{display:flex;justify-content:space-between;color:#eee;border-bottom:1px solid #2a2a36;padding-bottom:.3rem;margin-bottom:.5rem;flex-shrink:0}
    .card-header h2{font-size:1.1rem;font-weight:500}
    .badge{background:#262633;padding:0 .6rem;border-radius:20px;font-size:.6rem;color:#b8b8d0}
    .vertical-list{display:flex;flex-direction:column;gap:.2rem;list-style:none;overflow:hidden;justify-content:center;flex:1}
    .custom-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:.2rem .3rem;background:#18181f;color:#e4e4f0;text-decoration:none;border-radius:.8rem;font-size:.6rem;border:1px solid #292933;transition:.1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none}
    .custom-btn:hover{background:#26263a;border-color:#4f7fd5;color:#fff}
    .custom-btn[href*="roblox"]{background:#1b2335;border-color:#3f6fc0;color:#bfd6ff}
    .custom-btn[href*="roblox"]:hover{background:#293f60;border-color:#6a9aff}
    .footer{text-align:center;color:#555;font-size:.5rem;padding-top:.4rem;border-top:1px solid #1a1a22;margin-top:.4rem;flex-shrink:0;letter-spacing:.5px}
    @media(max-width:480px){.link-card{padding:.6rem}.card-header h2{font-size:.9rem}.custom-btn{font-size:.5rem;padding:.15rem .2rem;border-radius:.6rem}.vertical-list{gap:.15rem}.footer{font-size:.45rem}}
